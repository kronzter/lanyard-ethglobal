# One Foundry project for every Lanyard contract (plans/00-README.md › The app).
# Dependencies come from Soldeer into dependencies/ (git-ignored); never git submodules.
#   src/faucet, test/faucet  → Track B (Rabdi Faucet, B1.1)
#   src/ens,    test/ens     → Track A (ENSv2 registrars on Sepolia, A1+)

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]
# Compiler: no global pin. ENSv2 (contracts-v2 at f2f0a05) declares an exact `pragma solidity 0.8.25`, so
# every file that imports it (src/ens, test/ens) uses `pragma solidity 0.8.25` too; Track B files keep
# `0.8.28`. Foundry picks the matching solc per file. Both use optimizer 200 runs, no via_ir, cancun,
# the same settings ENSv2 builds with.
auto_detect_solc = true
ignored_warnings_from = ["dependencies/"]
optimizer = true
optimizer_runs = 200
# Sepolia supports cancun. Rabdi's EVM version is measured by P0.6-S6 before the Faucet deploys.
evm_version = "cancun"

[soldeer]
remappings_generate = false
remappings_regenerate = false
remappings_location = "txt"
recursive_deps = false

[fmt]
line_length = 110

[dependencies]
forge-std = "1.17.0"
ens-contracts-v2 = { version = "sepolia-2026-09-15", git = "https://github.com/ensdomains/contracts-v2.git", rev = "f2f0a05e6c1711134b73204a1e37f8e6c1aea6ab" }
openzeppelin-contracts = { version = "5.3.0", git = "https://github.com/OpenZeppelin/openzeppelin-contracts.git", rev = "e4f70216d759d8e6a64144a9e1f7bbeed78e7079" }
verifiable-factory = { version = "2026-ens", git = "https://github.com/ensdomains/verifiable-factory.git", rev = "5ef7b1a88fd9062bae580ed4048ca369f18450c4" }
ens-contracts-v1 = { version = "2026-ens", git = "https://github.com/ensdomains/ens-contracts.git", rev = "121dc232df06be28e5eabb34ebfc4bc788498c05" }
openzeppelin-contracts-upgradeable = { version = "5.2.0", git = "https://github.com/OpenZeppelin/openzeppelin-contracts-upgradeable.git", rev = "5fc3fee14043035097ae718387200f4f4daaa982" }
